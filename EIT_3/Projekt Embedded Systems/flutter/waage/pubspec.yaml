name: waage
description: "BLE Waage App für Android"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Pin to 1.x to keep the older, compatible API used in this app.
  flutter_blue_plus: ^1.7.0
  permission_handler: ^12.0.1

  cupertino_icons: ^1.0.8

  # Für Rezept-Im/Export + Gauge-Visualisierung
  path_provider: ^2.1.0
  crypto: ^3.0.3
  convert: ^3.1.1

  # Für die Datenbank
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
